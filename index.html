<title>Hook &amp; Row</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8A2F66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hook & Row">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: phone-first app shell — one column of content, fixed bottom tab bar, one main action per screen */
:root{
  --bg:#F5F2F6; --surface:#FFFFFF; --sunk:#ECE6EE; --line:#DCD3E0;
  --ink:#251E2B; --muted:#6B6072;
  --accent:#8A2F66; --accent-ink:#FFFFFF; --accent-soft:#F4E2EC;
  --mustard:#B87C0E; --mustard-soft:#FBEFD6;
  --ok:#2E7A55; --ok-soft:#DFF1E7;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18131C; --surface:#231C28; --sunk:#2D2533; --line:#3B3142;
  --ink:#F2ECF4; --muted:#B4A8BB;
  --accent:#E58BC0; --accent-ink:#2A0F20; --accent-soft:#3A2233;
  --mustard:#E9B54F; --mustard-soft:#3A2E17;
  --ok:#7FD3A6; --ok-soft:#1D3328; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#18131C; --surface:#231C28; --sunk:#2D2533; --line:#3B3142;
  --ink:#F2ECF4; --muted:#B4A8BB;
  --accent:#E58BC0; --accent-ink:#2A0F20; --accent-soft:#3A2233;
  --mustard:#E9B54F; --mustard-soft:#3A2E17;
  --ok:#7FD3A6; --ok-soft:#1D3328; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.back{border:0;background:var(--sunk);border-radius:999px;padding:8px 16px 8px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.back svg{width:18px;height:18px}
.lead{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0}

/* category picker */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);text-align:left;min-height:64px}
.cat svg{width:30px;height:30px;flex:none;color:var(--muted)}
.cat b{display:block;font-size:16px;line-height:1.2}
.cat small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cat[aria-pressed="true"] svg{color:var(--accent)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}

/* pattern cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;border:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;box-shadow:0 1px 0 var(--line)}
.swatch{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;background:var(--sw);
  background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.22) 0 2px,transparent 3px),radial-gradient(circle at 75% 70%,rgba(255,255,255,.22) 0 2px,transparent 3px);
  background-size:18px 18px}
.swatch svg{width:46%;height:46%;color:rgba(255,255,255,.95)}
.swatch .vid{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:4px}
.swatch .vid svg{width:11px;height:11px}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .name{font-weight:700;line-height:1.25}
.card .by{color:var(--muted);font-size:14px}
.level{align-self:flex-start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.level.beg{background:var(--ok-soft);color:var(--ok)}

/* detail */
.hero-swatch{border-radius:var(--r);aspect-ratio:16/8}
.hero-swatch svg{width:28%;height:56%}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sunk);color:var(--ink)}
.tag.beg{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--mustard-soft);color:var(--mustard)}
.how{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.how b{font-family:var(--display);font-size:17px}
.needs{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;background:var(--surface);border-radius:var(--r);padding:14px 16px;margin:0}
.needs dt{color:var(--muted);font-weight:700;font-size:15px}
.needs dd{margin:0;min-width:0}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:var(--r);font-weight:700;font-size:17px;text-decoration:none;border:2px solid transparent;padding:10px 16px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.note{font-size:15px;color:var(--muted)}
.fine{font-size:14px;color:var(--muted)}

/* projects */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:0;border-radius:var(--r);padding:10px;text-align:left;width:100%}
.pitem .mini{width:58px;height:58px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--sw)}
.pitem .mini svg{width:30px;height:30px;color:#fff}
.pitem .mini img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pitem .txt{min-width:0;flex:1}
.pitem .txt b{display:block;line-height:1.25}
.pitem .txt span{color:var(--muted);font-size:14px}
.empty{background:var(--surface);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* make mode */
.counter{background:var(--surface);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.counter .label{display:flex;gap:6px}
.counter .label button{border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.counter .label button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-family:var(--display);font-size:96px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.plus{width:100%;min-height:84px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:26px;font-weight:800}
.plus:active{transform:scale(.98)}
.counter .small{display:flex;gap:10px;width:100%}
.counter .small button{flex:1;min-height:48px;border-radius:var(--r);border:2px solid var(--line);background:transparent;font-weight:700}
.confirm{display:flex;flex-direction:column;gap:8px;width:100%;background:var(--mustard-soft);border-radius:var(--r);padding:12px}
.confirm div{display:flex;gap:8px}
.confirm button{flex:1;min-height:44px;border-radius:10px;border:0;font-weight:700}
.confirm .yes{background:var(--mustard);color:var(--bg)}
.confirm .no{background:var(--surface)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;padding:12px;resize:vertical}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .del{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:30px;height:30px;font-weight:700}
.addphoto{display:grid;place-items:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;color:var(--muted);font-weight:700;font-size:14px;text-align:center;padding:6px;cursor:pointer}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0}

/* learn */
.lessons{display:flex;flex-direction:column;gap:10px}
details{background:var(--surface);border-radius:var(--r);padding:0 16px}
summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:700;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .n{width:28px;height:28px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px;flex:none;font-variant-numeric:tabular-nums}
summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .in{padding:0 0 16px 40px;display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em;background:var(--sunk);border-radius:6px;padding:1px 6px}
.decode{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.line{display:flex;flex-wrap:wrap;gap:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px}
.line button{border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 7px}
.line button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.explain{background:var(--accent-soft);border-radius:10px;padding:12px;min-height:72px}
.stitch{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px}
.stitch .ab{font-family:var(--display);font-weight:800;font-size:18px;min-width:56px}
.stitch .txt{flex:1;min-width:0}
.stitch .txt span{display:block;color:var(--muted);font-size:14px}
.stitch a{flex:none;display:flex;align-items:center;gap:4px;font-weight:700;text-decoration:none;border:2px solid var(--accent);border-radius:999px;padding:6px 12px;font-size:14px}
.stitch a svg{width:12px;height:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;font-size:15px}
input[type=search]{width:100%;min-height:48px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;padding:8px 18px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cats{grid-template-columns:repeat(4,minmax(0,1fr))}.cat{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* sections added: tutorials, favourites, must make */
.tabs nav{grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:12px;padding-inline:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .btn{min-height:50px;font-size:16px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.vlist{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:start;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px}
.vrow .right{min-width:0;display:flex;flex-direction:column;gap:10px}
.vrow .mini{width:58px;height:58px;border-radius:10px;display:grid;place-items:center;background:var(--sw);position:relative}
.vrow .mini svg{width:28px;height:28px;color:#fff}
.vrow .mini .pl{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:999px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.vrow .mini .pl svg{width:11px;height:11px;color:var(--bg)}
.vrow .txt{min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:0}
.vrow .txt b{line-height:1.25}
.vrow .txt span{color:var(--muted);font-size:14px;line-height:1.3}
.vrow .acts{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:999px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.watch{display:flex;align-items:center;gap:5px;height:44px;padding:0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:15px}
.watch svg{width:12px;height:12px}
.remind{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--mustard)}
.remind h2{display:flex;align-items:center;gap:8px}
.remind h2 svg{width:22px;height:22px;color:var(--mustard)}
.mlist{display:flex;flex-direction:column;gap:12px}
.mitem{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px}
.mitem .headr{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;background:none;padding:0;width:100%}
.mitem .headr .mini{width:58px;height:58px;border-radius:10px;display:grid;place-items:center;background:var(--sw)}
.mitem .headr .mini svg{width:30px;height:30px;color:#fff}
.mitem .headr b{display:block;line-height:1.25;font-size:17px}
.mitem .headr .sub{display:block;color:var(--muted);font-size:14px}
.datebox{display:flex;flex-direction:column;gap:6px}
.datebox label{font-weight:700;font-size:15px}
.datebox .dr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date]{min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:6px 10px;flex:1;min-width:0}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.due{background:var(--mustard);color:var(--bg)}
.pill.soon{background:var(--mustard-soft);color:var(--mustard)}
.pill.later{background:var(--sunk);color:var(--muted)}
.mitem .pair .btn{min-height:46px;font-size:15px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rline{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
.rline b{min-width:0}

.chip,.seg button,.counter .label button,.link-btn,.line button{min-height:44px}
.chip{display:inline-flex;align-items:center}
.cat{min-height:72px}
/* v3: overview home, combined patterns + videos, thumbnails */
.tabs nav{grid-template-columns:repeat(4,1fr)}
.tabs button{font-size:12.5px}
.chip,.seg button,.counter .label button,.link-btn,.line button{min-height:44px}
.chip{display:inline-flex;align-items:center;gap:6px}
.thumb{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--sw);display:grid;place-items:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb > svg{width:42%;height:42%;color:rgba(255,255,255,.95)}
.thumb .vid{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.66);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;display:flex;align-items:center;gap:4px;z-index:1}
.thumb .vid svg{width:11px;height:11px}
.card .thumb{border-radius:0}
.hero-img{border-radius:var(--r);aspect-ratio:16/9}
.mini{position:relative;overflow:hidden}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* video cards */
.vcard{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink);border:2px solid var(--line)}
.vcard.main{border-color:var(--accent)}
.vcard .vt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--sw)}
.vcard .vt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard .vt .pb{position:absolute;inset:0;margin:auto;width:40px;height:40px;border-radius:999px;background:rgba(0,0,0,.6);display:grid;place-items:center}
.vcard .vt .pb svg{width:16px;height:16px;color:#fff;margin-left:2px}
.vcard b{display:block;line-height:1.25}
.vcard span{color:var(--muted);font-size:14px}
.vcard .open{color:var(--accent);font-weight:700;font-size:14px}
/* overview */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;min-height:68px}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;min-width:30px}
.stat span{font-weight:700;line-height:1.2}
.stat small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.cont{background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.cont .thumb{aspect-ratio:16/8}
.cont .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cont .rowsdone{display:flex;align-items:baseline;gap:8px}
.cont .rowsdone b{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.learnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

async function getPhotos(id){ const d=await db(); if(!d) return mem[id]||[]; return new Promise(res=>{try{const q=d.transaction('photos').objectStore('photos').get(id);q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res(mem[id]||[])}catch(e){res(mem[id]||[])}}); }
async function setPhotos(id,arr){ mem[id]=arr; const d=await db(); if(!d) return; try{d.transaction('photos','readwrite').objectStore('photos').put(arr,id)}catch(e){} }
function shrink(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,900/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }

/* ---------- dates ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysUntil(s){ const [y,m,d]=s.split('-').map(Number); const t=new Date(); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function niceDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function duePill(s){
  if(!s) return '';
  const n=daysUntil(s);
  if(n<0) return `<span class="pill due">${-n} day${n===-1?'':'s'} late</span>`;
  if(n===0) return `<span class="pill due">Today</span>`;
  if(n<=7) return `<span class="pill soon">In ${n} day${n===1?'':'s'}</span>`;
  return `<span class="pill later">${niceDate(s)}</span>`;
}
const dueSoon = ()=>Object.entries(must).filter(([,m])=>m.date && daysUntil(m.date)<=7).sort((a,b)=>a[1].date.localeCompare(b[1].date));

/* ---------- Stitch videos + reading guide ---------- */
const TERMS = [
  ['sl st','Slip stitch','Joins rounds or moves along without adding height.'],
  ['st / sts','Stitch / stitches',''],
  ['tr','Treble crochet (US)','Taller than a double crochet. UK calls it dtr.'],
  ['inc','Increase','Two stitches in the same stitch. Makes the piece wider.'],
  ['dec','Decrease','Joins two stitches into one. Makes the piece narrower.'],
  ['BLO / FLO','Back / front loop only','Work into just one of the two top loops. Gives a ribbed look.'],
  ['sk','Skip','Miss a stitch and go to the next one.'],
  ['sp / ch-sp','Space / chain space','The gap under a chain. You work into the gap, not the chain.'],
  ['rep','Repeat',''],
  ['RS / WS','Right side / wrong side','The front and back of your work.'],
  ['fsc','Foundation single crochet','Makes the chain and first row at the same time.'],
  ['FPdc / BPdc','Front / back post double crochet','Worked around the stitch post. Used for ribbing.']
];
const DECODE = [
  ['Row 3:','This is the third row. The number at the end tells you how many stitches you should have when the row is done.'],
  ['Ch 1,','Chain 1. This lifts your yarn to the height of a single crochet. In most patterns it does not count as a stitch. The pattern notes will say.'],
  ['sc in first st,','Single crochet into the first stitch.'],
  ['*','A star marks the start of a repeat. Remember where it is.'],
  ['2 sc in next st,','Two single crochets in the same stitch. This is an increase.'],
  ['sc in next 2 sts;','One single crochet in each of the next 2 stitches.'],
  ['rep from * across,','Go back to the star and do that part again, until you reach the end of the row.'],
  ['turn.','Turn your work over so you can start the next row.'],
  ['(21 sts)','You should now have 21 stitches. Count them. If Row 2 had 16 stitches, that is 1 + 5 repeats of 4 = 21.']
];
let dSel = 0;
function lesson(n,title,html){ return `<details><summary><span class="n">${n}</span>${title}</summary><div class="in">${html}</div></details>`; }
function vStitches(){
  return `${backBtn()}<div class="section"><h1>Stitch videos</h1><p class="lead">Start here if you're new. Each video opens on YouTube.</p></div>
  <div class="vlist">${STITCHES.map(s=>vcard(s.vid,{label:s.name+' ('+s.ab+')'})).join('')}</div>
  <div class="section"><h2>US and UK names</h2><div class="tbl"><table><thead><tr><th>Stitch</th><th>US</th><th>UK</th></tr></thead><tbody>${STITCHES.filter(s=>s.ab!=='MR').map(s=>`<tr><td>${s.name}</td><td><b>${s.ab}</b></td><td><b>${s.uk}</b></td></tr>`).join('')}</tbody></table></div></div>
  <div class="section"><h2>Other words you'll see</h2>
  <div class="tbl"><table><thead><tr><th>Short</th><th>Means</th></tr></thead><tbody>${TERMS.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}${t[2]?`<br><span class="fine">${t[2]}</span>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vRead(){
  return `${backBtn()}<div class="section"><h1>Read a pattern</h1></div>
  <div class="section"><h2>Read a line, piece by piece</h2>
    <div class="decode"><p class="fine">Tap each part of this example line.</p>
    <div class="line">${DECODE.map((d,i)=>`<button data-dec="${i}" aria-pressed="${dSel===i}">${esc(d[0])}</button>`).join('')}</div>
    <div class="explain" aria-live="polite"><b>${esc(DECODE[dSel][0])}</b><br>${esc(DECODE[dSel][1])}</div></div></div>
  <div class="section"><h2>The basics</h2><div class="lessons">
  ${lesson(1,'Check what you need first',`<p>Every pattern starts with the yarn, hook size and other tools. Use the same yarn weight and hook size so your piece comes out the right size.</p><p>Yarn weight is a number from 0 (thinnest) to 7 (thickest). For example, DK is 3, worsted is 4 and super bulky is 6.</p>`)}
  ${lesson(2,'US or UK terms?',`<p>The same stitch has different names in the US and UK. The pattern notes say which one it uses.</p><div class="tbl"><table><thead><tr><th>US</th><th>UK</th></tr></thead><tbody><tr><td>slip stitch (sl st)</td><td>slip stitch (ss)</td></tr><tr><td>single crochet (sc)</td><td>double crochet (dc)</td></tr><tr><td>half double crochet (hdc)</td><td>half treble (htr)</td></tr><tr><td>double crochet (dc)</td><td>treble (tr)</td></tr><tr><td>treble (tr)</td><td>double treble (dtr)</td></tr></tbody></table></div><p class="fine">Watch out: "dc" means a different stitch in each. Check the terms before you start.</p>`)}
  ${lesson(3,'Rows and rounds',`<p><b>Row</b>: you work back and forth, turning at the end. Used for flat pieces like a bag panel.</p><p><b>Round (Rnd)</b>: you work in a circle without turning. Used for hats, coasters and toys.</p>`)}
  ${lesson(4,'Symbols that mean "repeat"',`<p><span class="mono">* … *</span> or <span class="mono">* … ; rep from *</span>: repeat the part after the star.</p><p><span class="mono">( … )</span>: do everything inside the brackets in the same stitch, for example <span class="mono">(sc, ch 2, sc) in next st</span>.</p><p><span class="mono">[ … ] 3 times</span>: repeat what's inside the square brackets 3 times.</p>`)}
  ${lesson(5,'Stitch counts',`<p>A number at the end of a row, like <span class="mono">(21)</span> or <span class="mono">&lt;21 sts&gt;</span>, is how many stitches you should have. Count them. If the number is wrong, fix it now. It's much harder later.</p>`)}
  ${lesson(6,'Sizes in brackets',`<p>Clothing patterns write every size at once: <span class="mono">Ch 63 (69, 75, 81)</span>. The first number is the smallest size. The numbers in brackets are the next sizes, in order. Circle your size's numbers before you start.</p>`)}
  ${lesson(7,'Gauge',`<p>Gauge is how many stitches and rows fit in 10 cm. Make a small test square first. Too many stitches? Use a bigger hook. Too few? Use a smaller hook. For bags and toys, gauge matters less. For clothes, it decides whether it fits.</p>`)}
  </div></div>`;
}

/* ---------- Favourites ---------- */
let fseg = 'patterns';
function vFavs(){
  const body = fseg==='patterns'
    ? (favP.length?`<div class="grid">${favP.map(id=>card(PM[id])).join('')}</div>`:`<div class="empty">Tap <b>Favourite</b> on any pattern to keep it here.<button class="btn ghost" data-tab="patterns">Find patterns</button></div>`)
    : (favV.length?`<div class="vlist">${favV.map(id=>vcard(id)).join('')}</div>`:`<div class="empty">Tap <b>Add to favourites</b> under any video to keep it here.<button class="btn ghost" data-tab="patterns">Find videos</button></div>`);
  return `<div class="section"><h1>Favourites</h1></div>${seg('f',fseg,[['patterns','Patterns ('+favP.length+')'],['videos','Videos ('+favV.length+')']])}${body}`;
}

/* ---------- Must make ---------- */
function vMust(){
  const items = Object.entries(must).sort((a,b)=>{ const x=a[1].date||'9999', y=b[1].date||'9999'; return x.localeCompare(y) || a[1].added-b[1].added; });
  return `<div class="section"><h1>Must make</h1><p class="lead">Things you want to make next. Pick a date and a reminder shows on Home when it's close.</p></div>
  ${items.length?`<div class="mlist">${items.map(([id,m])=>{ const p=PM[id], started=projects[id]; return `<div class="mitem">
      <button class="headr" data-open="${id}">${miniBox(p)}<span><b>${esc(p.name)}</b><span class="sub">${esc(p.by)} · ${CAT[p.cat].name}</span></span></button>
      ${dateBox(id,m)}
      <div class="pair"><button class="btn primary" data-start="${id}">${started?'Continue':'Start it'}</button><button class="btn secondary" data-unmust="${id}">Remove</button></div>
    </div>`; }).join('')}</div>`
  :`<div class="empty">Nothing here yet. Open a pattern and tap <b>Must make</b>.<button class="btn ghost" data-tab="patterns">Find patterns</button></div>`}
  <p class="fine">Reminders appear inside this app. It can't send notifications to your phone.</p>`;
}

/* ---------- render ---------- */
const TABS = [['home','Home','tHome'],['patterns','Patterns','tPat'],['favs','Favourites','tFav'],['must','Must make','tMust']];
function render(){
  const c = cur(), app = document.getElementById('app');
  const V = {home:vHome,patterns:vPatterns,favs:vFavs,must:vMust,projects:vProjects,pattern:vPattern,make:vMake,stitches:vStitches,read:vRead};
  app.innerHTML = V[c.v](c.arg);
  const nDue = dueSoon().filter(([,m])=>daysUntil(m.date)<=0).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k,l,ic])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''} style="position:relative">${I[ic]}${l}${k==='must'&&nDue?`<span style="position:absolute;top:6px;left:calc(50% + 6px);background:var(--mustard);color:var(--bg);border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px">${nDue}</span>`:''}</button>`).join('');
  if(c.v==='make') afterMake(c.arg);
  if(c.v==='home'||c.v==='projects') fillThumbs();
  const q=document.getElementById('q'); if(q){ q.oninput=e=>{ bf.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('[data-date]').forEach(inp=>inp.onchange=()=>{ must[inp.dataset.date].date=inp.value; saveAll(); toast(inp.value?'Reminder set for '+niceDate(inp.value):'Reminder cleared'); render(); });
}
async function fillThumbs(){
  for(const el of document.querySelectorAll('[data-thumb]')){
    const ph = await getPhotos(el.dataset.thumb);
    if(ph.length) el.innerHTML = `<img src="${ph[ph.length-1]}" alt="">`;
  }
}
let wake=null;
async function afterMake(id){
  const ta=document.getElementById('notes'); if(!ta) return;
  ta.oninput=()=>{ projects[id].notes=ta.value; saveAll(); };
  const box=document.getElementById('photos');
  const ph = await getPhotos(id);
  box.innerHTML = ph.map((src,i)=>`<figure><img src="${src}" alt="Project photo ${i+1}"><button class="del" data-delph="${i}" aria-label="Remove photo">×</button></figure>`).join('') +
    `<label class="addphoto">+ Add photo<input type="file" accept="image/*" id="addph"></label>`;
  document.getElementById('addph').onchange = async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=await shrink(f); const arr=await getPhotos(id); arr.push(d); await setPhotos(id,arr); toast('Photo added'); afterMake(id);}catch(err){ toast("That photo couldn't be added. Try another.") }
  };
  try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null);} }catch(e){}
}

document.addEventListener('click', async e=>{
  const t = e.target.closest('button,[data-open]'); if(!t) return; if(t.tagName==='A') return;
  const d = t.dataset;
  if(d.act==='back') return back();
  if(d.tab) return switchTab(d.tab);
  if(d.tabgo){ const [tb,sub]=d.tabgo.split(':'); return switchTab(tb,sub); }
  if(d.go){ const [v,s]=d.go.split(':'); if(v==='projects'&&s) pseg=s; return go(v); }
  if(d.pick){ bf.cats = bf.cats.includes(d.pick)?bf.cats.filter(x=>x!==d.pick):[...bf.cats,d.pick]; return render(); }
  if(d.lvl){ bf.lvl=d.lvl; return render(); }
  if(d.clear!==undefined){ bf={cats:[],lvl:'all',vid:false,q:'',type:'all'}; return render(); }
  if(d.type){ bf.type=d.type; return render(); }
  if(d.favv){ const id=d.favv; if(favV.includes(id)){favV=favV.filter(x=>x!==id);toast('Removed from favourites')}else{favV.push(id);toast('Added to favourites')} saveAll(); return render(); }
  if(d.open) return go('pattern',d.open);
  if(d.make){ confirmReset=false; if(projects[d.make]){projects[d.make].last=Date.now();saveAll();} return go('make',d.make); }
  if(d.bt){ bf[d.bt]=!bf[d.bt]; return render(); }
  if(d.seg){ const [n,k]=d.seg.split(':'); if(n==='p')pseg=k; if(n==='f')fseg=k; return render(); }
  if(d.dec!==undefined){ dSel=+d.dec; return render(); }
  if(d.favp){ const id=d.favp; if(favP.includes(id)){favP=favP.filter(x=>x!==id);toast('Removed from favourites')}else{favP.push(id);toast('Added to favourites')} saveAll(); return render(); }
  if(d.must){ const id=d.must; if(must[id]){delete must[id];toast('Removed from Must make')}else{must[id]={date:'',added:Date.now()};toast('Added to Must make. Pick a date below.')} saveAll(); return render(); }
  if(d.unmust){ delete must[d.unmust]; saveAll(); toast('Removed from Must make'); return render(); }
  if(d.cleardate){ must[d.cleardate].date=''; saveAll(); toast('Reminder cleared'); return render(); }
  if(d.start){ const id=d.start; if(!projects[id]){ projects[id]={row:0,unit:'Row',notes:'',started:Date.now(),last:Date.now(),done:false}; toast('Added to My projects'); } else projects[id].last=Date.now(); if(must[id]) delete must[id]; saveAll(); confirmReset=false; return go('make',id); }
  const id = cur().arg;
  if(d.inc){ const x=projects[id]; x.row=Math.max(0,(x.row||0)+(+d.inc)); x.last=Date.now(); saveAll(); confirmReset=false; return render(); }
  if(d.unit){ projects[id].unit=d.unit; saveAll(); return render(); }
  if(d.reset){ if(d.reset==='ask') confirmReset=true; else { if(d.reset==='yes'){projects[id].row=0; saveAll();} confirmReset=false; } return render(); }
  if(d.done){ projects[d.done].done=!projects[d.done].done; saveAll(); toast(projects[d.done].done?'Marked as finished':'Moved back to Making'); return render(); }
  if(d.delph!==undefined){ const arr=await getPhotos(id); arr.splice(+d.delph,1); await setPhotos(id,arr); return afterMake(id); }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ wake=null; render(); } });

/* ---------- PWA: pictures from the web ---------- */
const ytThumb = id => 'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
function pImg(p){ if(!p) return null; if(p.video) return ytThumb(p.video); return p.img || (typeof IMGSRC!=='undefined'&&IMGSRC[p.id]) || null; }
function vImg(id){ return ytThumb(id); }
document.addEventListener('error', e=>{ const t=e.target; if(t&&t.tagName==='IMG') t.remove(); }, true);

/* ---------- PWA: in-app viewer for videos and patterns ---------- */
const viewer = document.createElement('div');
viewer.className='viewer'; viewer.hidden=true;
viewer.innerHTML='<div class="vbar"><button class="vback" data-vclose="1" aria-label="Back">'+I.back+'<span>Back</span></button><b class="vtitle"></b><a class="vext" target="_blank" rel="noopener">Open in browser</a></div><div class="vbody"></div>';
document.body.appendChild(viewer);
function openViewer(url,title){
  const m = url.match(/youtube\.com\/watch\?v=([\w-]{11})/);
  const body = viewer.querySelector('.vbody');
  viewer.querySelector('.vtitle').textContent = title||'';
  viewer.querySelector('.vext').href = url;
  if(m){ body.className='vbody vvid'; body.innerHTML='<div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/'+m[1]+'?playsinline=1&rel=0&modestbranding=1" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><p class="fine">Tip: turn your phone sideways for a bigger picture.</p>'; }
  else { body.className='vbody vpage'; body.innerHTML='<iframe src="'+url+'" title="Pattern"></iframe>'; }
  viewer.hidden=false; document.body.style.overflow='hidden';
  history.pushState({viewer:1},'');
}
function closeViewer(){ viewer.hidden=true; viewer.querySelector('.vbody').innerHTML=''; document.body.style.overflow=''; }
window.addEventListener('popstate',()=>{ if(!viewer.hidden) closeViewer(); });
document.addEventListener('click', e=>{
  if(e.target.closest('[data-vclose]')){ e.preventDefault(); history.back(); return; }
  const a = e.target.closest('a[target="_blank"]');
  if(!a || a.classList.contains('vext')) return;
  e.preventDefault(); e.stopPropagation();
  const t = (a.querySelector('b')||{}).textContent || (document.querySelector('.app h1')||{}).textContent || '';
  openViewer(a.href, t);
}, true);

/* ---------- PWA: offline + install ---------- */
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

render();
</script>
